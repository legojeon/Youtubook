<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Youtubook</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <style>
    body { width:260px; margin:0; padding:0 12px 12px; background:var(--canvas); color:var(--body);
      font-family:var(--font); font-size:13px; line-height:1.5; }
    .brand { padding:14px 0 12px; }
    .brand img { width:28px; height:28px; border-radius:7px; }
    .brand .wordmark { font-size:18px; }
    #go { width:100%; height:44px; }
    #status { color:var(--mute); margin:8px 0 0; }
    #status:empty { display:none; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="/icons/icon48.png" alt="Youtubook">
    <span class="wordmark">Youtubook</span>
  </div>
  <button id="go" class="btn btn-primary" data-i18n="popup_generate">그림책 생성</button>
  <p id="status"></p>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
