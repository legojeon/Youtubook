<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title data-i18n="results_pageTitle">Youtubook — 장면 선택</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="./results.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="/icons/icon48.png" alt="Youtubook">
      <span class="wordmark">Youtubook</span>
    </div>
    <div class="bar">
      <h1 id="video-title" data-i18n="results_loading">불러오는 중…</h1>
      <span id="scene-count" class="count"></span>
      <span class="spacer"></span>
      <label class="field"><span data-i18n="results_sensitivity">민감도</span> <input type="range" id="sensitivity" min="1" max="10" step="1">
        <span id="sensitivity-value" class="val"></span></label>
      <button id="redetect" class="icon-btn" data-i18n-title="results_redetect" title="재검출" aria-label="재검출">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="select-all" class="btn btn-secondary" data-i18n="results_selectAll">전체 선택</button>
      <button id="select-none" class="btn btn-secondary" data-i18n="results_selectNone">전체 해제</button>
      <span id="selected-count" class="count">0개 선택</span>
      <button id="next" class="btn btn-primary" disabled data-i18n="results_next">다음 →</button>
    </div>
    <div id="banners"></div>
  </header>
  <main id="grid"></main>
  <section id="export-panel" hidden>
    <h2 id="export-heading"></h2>
    <div class="dl-grid">
      <button id="view-book" class="dl dl-view"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span><span data-i18n="viewer_view">책으로 보기</span> <span class="fmt" data-i18n="viewer_view_sub">새 탭에서 열기</span></span></button>
      <a id="install-full" class="dl" hidden href="https://github.com/legojeon/Youtubook/releases" target="_blank" rel="noopener noreferrer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.92c.575.106.785-.25.785-.556 0-.274-.01-1.001-.015-1.965-3.198.695-3.873-1.542-3.873-1.542-.523-1.328-1.278-1.682-1.278-1.682-1.044-.714.08-.699.08-.699 1.154.081 1.762 1.185 1.762 1.185 1.026 1.758 2.693 1.25 3.35.955.104-.743.401-1.25.73-1.538-2.553-.29-5.238-1.277-5.238-5.683 0-1.255.448-2.281 1.184-3.086-.119-.29-.513-1.46.112-3.045 0 0 .966-.309 3.165 1.179a11 11 0 0 1 2.88-.388c.977.004 1.961.132 2.88.388 2.198-1.488 3.163-1.18 3.163-1.18.626 1.586.232 2.756.114 3.046.737.805 1.182 1.831 1.182 3.086 0 4.417-2.689 5.39-5.25 5.674.413.355.78 1.056.78 2.129 0 1.537-.014 2.776-.014 3.154 0 .308.207.667.79.554A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg><span><span data-i18n="install_full_label">Youtubook Full</span> <span class="fmt" data-i18n="install_full_sub">GitHub에서 보기 ↗</span></span></a>
    </div>
    <p id="install-full-note" class="dl-note" hidden data-i18n="install_full_note"></p>
  </section>
  <script type="module" src="./results.ts"></script>
</body>
</html>
